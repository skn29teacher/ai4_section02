<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" role="img" aria-label="LCEL의 핵심은 입출력 연결"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="570" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">LCEL의 핵심은 입출력 연결</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">각 단계의 출력이 다음 단계의 입력이 된다.</text><rect x="40" y="170" width="255" height="160" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="40" y="170" width="7" height="160" rx="3" fill="#2457dc"/><text x="62" y="212" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">입력 dict</text><text x="62" y="247" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">inquiry: str</text><rect x="355" y="170" width="255" height="160" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="355" y="170" width="7" height="160" rx="3" fill="#2457dc"/><text x="377" y="212" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">Prompt</text><text x="377" y="247" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">ChatPromptValue</text><rect x="670" y="170" width="255" height="160" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="670" y="170" width="7" height="160" rx="3" fill="#087e8b"/><text x="692" y="212" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">Chat Model</text><text x="692" y="247" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">AIMessage</text><rect x="985" y="170" width="255" height="160" rx="18" fill="white" stroke="#c37a12" stroke-width="2"/><rect x="985" y="170" width="7" height="160" rx="3" fill="#c37a12"/><text x="1007" y="212" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">Text Parser</text><text x="1007" y="247" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">str</text><path d="M295,250 L355,250" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M610,250 L670,250" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M925,250 L985,250" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><text x="395" y="400" font-size="27" fill="#16324f" font-weight="700" text-anchor="start">| 연산자: 순차 실행 객체를 구성</text><text x="395" y="445" font-size="25" fill="#62748b" font-weight="500" text-anchor="start">chain.invoke(data): 이때 실제 실행</text><text x="680" y="495" font-size="21" fill="#087e8b" font-weight="700" text-anchor="start">모델 구간만 외부 호출</text><text x="38" y="550" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>