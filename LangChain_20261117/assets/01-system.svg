<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" role="img" aria-label="작은 LLM 서비스의 책임 경계"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="570" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">작은 LLM 서비스의 책임 경계</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">LangChain은 부품을 연결하고, 모델은 응답을 생성한다.</text><rect x="45" y="150" width="260" height="145" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="45" y="150" width="7" height="145" rx="3" fill="#2457dc"/><text x="67" y="192" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">업무 입력</text><text x="67" y="227" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">CSV / inquiry</text><text x="67" y="258" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">고객 문의 문자열</text><rect x="365" y="150" width="350" height="145" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="365" y="150" width="7" height="145" rx="3" fill="#2457dc"/><text x="387" y="192" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">Python 애플리케이션</text><text x="387" y="227" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">입력 검증 → 메시지 구성</text><text x="387" y="258" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">모델 응답 → 결과 저장</text><rect x="790" y="150" width="440" height="145" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="790" y="150" width="7" height="145" rx="3" fill="#087e8b"/><text x="812" y="192" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">모델 공급자 API</text><text x="812" y="227" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">OpenAI 기본 / Groq 선택</text><text x="812" y="258" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">이 구간에서 네트워크 호출</text><path d="M305,220 L365,220" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M715,220 L790,220" fill="none" stroke="#2457dc" stroke-width="3" marker-start="url(#blue)" marker-end="url(#blue)"/><rect x="365" y="355" width="350" height="120" rx="18" fill="white" stroke="#c37a12" stroke-width="2"/><rect x="365" y="355" width="7" height="120" rx="3" fill="#c37a12"/><text x="387" y="397" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">회사 정책 파일</text><text x="387" y="432" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">운영자가 관리하는 신뢰 맥락</text><path d="M540,355 L540,295" stroke="#c37a12" stroke-width="3" fill="none" marker-end="url(#gold)"/><rect x="790" y="355" width="440" height="120" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="790" y="355" width="7" height="120" rx="3" fill="#087e8b"/><text x="812" y="397" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">상담원 검토용 초안</text><text x="812" y="432" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">앱에서 저장 / 조회·승인·발송 없음</text><path d="M700,295 L700,330 L1010,330 L1010,355" fill="none" stroke="#2457dc" stroke-width="3" marker-end="url(#blue)"/><text x="38" y="550" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>