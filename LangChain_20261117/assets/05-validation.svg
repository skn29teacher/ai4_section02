<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" role="img" aria-label="모델 앞에서 입력 계약을 확인한다"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="570" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">모델 앞에서 입력 계약을 확인한다</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">확실하게 판단할 수 있는 규칙은 Python이 처리한다.</text><rect x="40" y="160" width="280" height="150" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="40" y="160" width="7" height="150" rx="3" fill="#2457dc"/><text x="62" y="202" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">외부 dict</text><text x="62" y="237" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">inquiry</text><text x="62" y="268" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">불필요한 context는 버림</text><rect x="420" y="160" width="360" height="150" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="420" y="160" width="7" height="150" rx="3" fill="#087e8b"/><text x="442" y="202" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">normalize_request</text><text x="442" y="237" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">문자열 · 공백 · 길이 검사</text><text x="442" y="268" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">정상 값만 반환</text><path d="M320,235 L420,235" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="905" y="160" width="330" height="150" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="905" y="160" width="7" height="150" rx="3" fill="#2457dc"/><text x="927" y="202" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">Prompt → Model</text><text x="927" y="237" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">검증을 통과한 문의만 전달</text><text x="927" y="268" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">정책은 서버측 파일에서 고정</text><path d="M780,235 L905,235" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#teal)"/><text x="842.5" y="223.0" font-size="19" fill="#087e8b" font-weight="500" text-anchor="middle">정상</text><rect x="420" y="385" width="360" height="120" rx="18" fill="white" stroke="#bd3e42" stroke-width="2"/><rect x="420" y="385" width="7" height="120" rx="3" fill="#bd3e42"/><text x="442" y="427" font-size="26" fill="#bd3e42" font-weight="700" text-anchor="start">오류 표시 후 중단</text><text x="442" y="462" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">뒤의 모델 호출은 없음</text><path d="M600,310 L600,385" stroke="#bd3e42" stroke-width="3" fill="none" marker-end="url(#red)"/><text x="900" y="420" font-size="25" fill="#087e8b" font-weight="700" text-anchor="start">RunnableLambda</text><text x="900" y="460" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">Python 함수를 LCEL에 연결</text><text x="38" y="550" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>