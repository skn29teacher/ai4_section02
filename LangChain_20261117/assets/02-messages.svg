<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" role="img" aria-label="문자열에서 역할 있는 메시지로"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="570" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">문자열에서 역할 있는 메시지로</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">역할 속성과 메시지 본문, 템플릿과 입력값을 구분한다.</text><rect x="45" y="145" width="540" height="180" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="45" y="145" width="7" height="180" rx="3" fill="#2457dc"/><text x="67" y="187" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">템플릿: 역할 + 빈칸</text><text x="67" y="222" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">system: 당신은 {role}입니다.</text><text x="67" y="253" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">human: {inquiry}</text><text x="67" y="284" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">변수는 아직 채워지지 않았다.</text><rect x="690" y="145" width="540" height="180" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="690" y="145" width="7" height="180" rx="3" fill="#087e8b"/><text x="712" y="187" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">입력: dict 하나</text><text x="712" y="222" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">role = 초안 작성 도우미</text><text x="712" y="253" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">inquiry = 주문 {order_id} 문의</text><text x="712" y="284" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">입력값 내부 중괄호는 데이터다.</text><path d="M310,325 L310,375" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><path d="M950,325 L950,375" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#teal)"/><rect x="45" y="390" width="1185" height="120" rx="18" fill="white" stroke="#c37a12" stroke-width="2"/><rect x="45" y="390" width="7" height="120" rx="3" fill="#c37a12"/><text x="67" y="432" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">prompt.invoke(data) → ChatPromptValue</text><text x="67" y="467" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">SystemMessage + HumanMessage / API 요청 0회</text><text x="38" y="550" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>