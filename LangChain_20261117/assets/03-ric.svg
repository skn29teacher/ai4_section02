<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" role="img" aria-label="프롬프트 설계의 세 가지 축"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="570" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">프롬프트 설계의 세 가지 축</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">특별한 API가 아니라 작업을 명확히 정의하는 설계 관점이다.</text><rect x="45" y="145" width="370" height="240" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="45" y="145" width="7" height="240" rx="3" fill="#2457dc"/><text x="67" y="187" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">ROLE · 관점</text><text x="67" y="222" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">누구의 관점인가?</text><text x="67" y="253" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">상담원 검토용</text><text x="67" y="284" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">초안 작성 도우미</text><text x="67" y="315" font-size="21" fill="#52677e" font-weight="500" text-anchor="start"></text><text x="67" y="346" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">메시지 role 속성과 구별</text><rect x="455" y="145" width="370" height="240" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="455" y="145" width="7" height="240" rx="3" fill="#087e8b"/><text x="477" y="187" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">INSTRUCTION · 작업</text><text x="477" y="222" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">무엇을 어떻게 하는가?</text><text x="477" y="253" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">한국어 존댓말</text><text x="477" y="284" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">인사 → 정책 → 다음 행동</text><text x="477" y="315" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">3~5문장 / 근거 없는 단정 금지</text><rect x="865" y="145" width="370" height="240" rx="18" fill="white" stroke="#c37a12" stroke-width="2"/><rect x="865" y="145" width="7" height="240" rx="3" fill="#c37a12"/><text x="887" y="187" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">CONTEXT · 근거</text><text x="887" y="222" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">무엇을 근거로 하는가?</text><text x="887" y="253" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">운영자 정책 파일</text><text x="887" y="284" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">미사용 · 수령 후 7일 이내</text><text x="887" y="315" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">배송비 금액은 추가 확인</text><text x="52" y="444" font-size="26" fill="#16324f" font-weight="700" text-anchor="start">고객 문의는 별도 human 메시지에 배치한다.</text><text x="52" y="487" font-size="23" fill="#62748b" font-weight="500" text-anchor="start">좋은 역할 설정이 없는 사실·주문 상태·승인 권한을 만들어 주지는 않는다.</text><text x="38" y="550" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>