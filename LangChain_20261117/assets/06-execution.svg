<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 570" role="img" aria-label="실행 방식은 달라도 같은 체인을 사용한다"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="570" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">실행 방식은 달라도 같은 체인을 사용한다</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">호출 수·동시성·화면 표시 방식을 별개로 생각한다.</text><rect x="40" y="150" width="365" height="150" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="40" y="150" width="7" height="150" rx="3" fill="#2457dc"/><text x="62" y="192" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">invoke · 단건</text><text x="62" y="227" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">dict 하나 → 문자열 하나</text><text x="62" y="258" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">모델 요청 보통 1회</text><rect x="455" y="150" width="365" height="150" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="455" y="150" width="7" height="150" rx="3" fill="#087e8b"/><text x="477" y="192" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">batch · 일괄</text><text x="477" y="227" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">dict 3개 → 결과 목록</text><text x="477" y="258" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">이번 실습은 동시성 1</text><rect x="870" y="150" width="365" height="150" rx="18" fill="white" stroke="#c37a12" stroke-width="2"/><rect x="870" y="150" width="7" height="150" rx="3" fill="#c37a12"/><text x="892" y="192" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">stream · 조각</text><text x="892" y="227" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">dict 하나 → 문자열 조각</text><text x="892" y="258" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">청크 하나 ≠ 항상 토큰 하나</text><rect x="75" y="365" width="330" height="72" rx="12" fill="#e0e9ff"/><rect x="460" y="365" width="330" height="72" rx="12" fill="#d8efed"/><rect x="845" y="365" width="330" height="72" rx="12" fill="#fff0d6"/><text x="100" y="410" font-size="23" fill="#16324f" font-weight="500" text-anchor="start">완성 결과를 받음</text><text x="485" y="410" font-size="23" fill="#16324f" font-weight="500" text-anchor="start">요청 수만큼 호출</text><text x="870" y="410" font-size="23" fill="#16324f" font-weight="500" text-anchor="start">조각을 순서대로 합침</text><text x="50" y="493" font-size="22" fill="#62748b" font-weight="500" text-anchor="start">batch는 공급자의 할인형 Batch API가 아니다. stream도 총비용 감소를 보장하지 않는다.</text><text x="38" y="550" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>