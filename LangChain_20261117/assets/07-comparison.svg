<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 595" role="img" aria-label="응답을 비교하려면 조건을 함께 기록한다"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#16324f"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#2457dc"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#087e8b"/></marker><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#c37a12"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#bd3e42"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#62748b"/></marker></defs><rect width="1280" height="595" rx="24" fill="#f1f5fb"/><g font-family="Noto Sans CJK KR,Malgun Gothic,sans-serif"><text x="38" y="54" font-size="31" fill="#16324f" font-weight="800" text-anchor="start">응답을 비교하려면 조건을 함께 기록한다</text><text x="38" y="91" font-size="21" fill="#62748b" font-weight="500" text-anchor="start">3개 문의 × 3개 버전 = 기본 최대 9회 호출</text><rect x="45" y="140" width="1185" height="95" rx="18" fill="white" stroke="#c37a12" stroke-width="2"/><rect x="45" y="140" width="7" height="95" rx="3" fill="#c37a12"/><text x="67" y="182" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">고정 조건: 동일 문의 3개 · 동일 정책 · 동일 모델 · 동일 설정</text><text x="67" y="217" font-size="21" fill="#52677e" font-weight="500" text-anchor="start"></text><rect x="45" y="280" width="365" height="135" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="45" y="280" width="7" height="135" rx="3" fill="#2457dc"/><text x="67" y="322" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">weak</text><text x="67" y="357" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">기본 요청</text><path d="M225,235 L225,280" stroke="#c37a12" stroke-width="3" fill="none" marker-end="url(#gold)"/><rect x="455" y="280" width="365" height="135" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="455" y="280" width="7" height="135" rx="3" fill="#087e8b"/><text x="477" y="322" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">role</text><text x="477" y="357" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">역할 추가</text><path d="M635,235 L635,280" stroke="#c37a12" stroke-width="3" fill="none" marker-end="url(#gold)"/><rect x="865" y="280" width="365" height="135" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="865" y="280" width="7" height="135" rx="3" fill="#2457dc"/><text x="887" y="322" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">designed</text><text x="887" y="357" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">작업·근거·한계 구체화</text><path d="M1045,235 L1045,280" stroke="#c37a12" stroke-width="3" fill="none" marker-end="url(#gold)"/><text x="50" y="475" font-size="25" fill="#16324f" font-weight="700" text-anchor="start">기록: 출력 원문 · 오류 · 지연 · 토큰 사용량 · 입력/정책 해시</text><text x="50" y="515" font-size="22" fill="#62748b" font-weight="500" text-anchor="start">문자 수와 문자열 포함 여부는 관측값이며 의미 품질 점수가 아니다.</text><text x="38" y="575" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>