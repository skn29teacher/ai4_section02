40" y="355" width="7" height="125" rx="3" fill="#c37a12"/><text x="62" y="397" font-size="26" fill="#c37a12" font-weight="700" text-anchor="start">policy.txt</text><text x="62" y="432" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">운영자 근거</text><rect x="430" y="150" width="355" height="125" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="430" y="150" width="7" height="125" rx="3" fill="#087e8b"/><text x="452" y="192" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">파일 계약 + 행 검증</text><text x="452" y="227" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">id 고유성 / 문의 문자열</text><path d="M310,210 L430,210" stroke="#2457dc" stroke-width="3" fill="none" marker-end="url(#blue)"/><rect x="430" y="355" width="355" height="125" rx="18" fill="white" stroke="#2457dc" stroke-width="2"/><rect x="430" y="355" width="7" height="125" rx="3" fill="#2457dc"/><text x="452" y="397" font-size="26" fill="#2457dc" font-weight="700" text-anchor="start">LCEL 답변 초안 체인</text><text x="452" y="432" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">Prompt → Model → Parser</text><path d="M605,275 L605,355" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#teal)"/><path d="M310,415 L430,415" stroke="#c37a12" stroke-width="3" fill="none" marker-end="url(#gold)"/><rect x="920" y="150" width="310" height="125" rx="18" fill="white" stroke="#bd3e42" stroke-width="2"/><rect x="920" y="150" width="7" height="125" rx="3" fill="#bd3e42"/><text x="942" y="192" font-size="26" fill="#bd3e42" font-weight="700" text-anchor="start">errors.jsonl</text><text x="942" y="227" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">실패 id와 오류 안내</text><path d="M785,210 L920,210" stroke="#bd3e42" stroke-width="3" fill="none" marker-end="url(#red)"/><rect x="920" y="355" width="310" height="125" rx="18" fill="white" stroke="#087e8b" stroke-width="2"/><rect x="920" y="355" width="7" height="125" rx="3" fill="#087e8b"/><text x="942" y="397" font-size="26" fill="#087e8b" font-weight="700" text-anchor="start">drafts.jsonl</text><text x="942" y="432" font-size="21" fill="#52677e" font-weight="500" text-anchor="start">id · 초안 · 모델 · 방식</text><path d="M785,415 L920,415" stroke="#087e8b" stroke-width="3" fill="none" marker-end="url(#teal)"/><path d="M785,380 L850,380 L850,250 L920,250" fill="none" stroke="#bd3e42" stroke-width="3" marker-end="url(#red)"/><text x="38" y="550" font-size="17" fill="#71829a" font-weight="500" text-anchor="start">이 교안의 실습코드에 맞춰 직접 구성한 개념도</text></g></svg>